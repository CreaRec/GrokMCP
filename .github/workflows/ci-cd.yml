name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/crearec/grok-mcp-apple-calendar
  DEPLOY_DIR: /home/crearec/grok-mcp

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple-calendar: ${{ steps.filter.outputs.apple-calendar }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apple-calendar:
              - 'servers/apple-calendar/**'
            compose:
              - 'docker-compose.yml'

  test:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/apple-calendar/package-lock.json

      - name: Install dependencies
        working-directory: servers/apple-calendar
        run: npm ci

      - name: Run tests
        working-directory: servers/apple-calendar
        run: npm test

      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.apple-calendar == 'true'

      - name: Build apple-calendar image (no push)
        if: needs.changes.outputs.apple-calendar == 'true'
        uses: docker/build-push-action@v7
        with:
          context: servers/apple-calendar
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.apple-calendar == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:main,${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: servers/apple-calendar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [test, changes, publish]
    if: >-
      always()
      && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.test.result == 'success'
      && (
        needs.changes.outputs.apple-calendar == 'true'
        || needs.changes.outputs.compose == 'true'
      )
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy compose pull/up
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_TAG_NEW: ${{ needs.publish.outputs.image_tag }}
          APPLE_CALENDAR_CHANGED: ${{ needs.changes.outputs.apple-calendar }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SERVER_HOST}"
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          SCP=(scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)

          "${SSH[@]}" "$SSH_TARGET" "mkdir -p '${DEPLOY_DIR}'"
          "${SCP[@]}" docker-compose.yml "${SSH_TARGET}:${DEPLOY_DIR}/docker-compose.yml"

          # Log remote Docker into GHCR (stdin, never echo token)
          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" "$SSH_TARGET" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          "${SSH[@]}" "$SSH_TARGET" bash -s <<EOF
          set -euo pipefail
          cd '${DEPLOY_DIR}'

          if [ ! -f .env ]; then
            echo "ERROR: ${DEPLOY_DIR}/.env is missing. Create it from .env.example (app secrets + IMAGE)." >&2
            exit 1
          fi

          # Export tag only for image published in this run; leave others from .env.
          if [ '${APPLE_CALENDAR_CHANGED}' = 'true' ] && [ -n '${IMAGE_TAG_NEW}' ]; then
            export IMAGE_TAG='${IMAGE_TAG_NEW}'
          fi

          docker compose pull
          docker compose up -d
          docker compose ps
          if [ '${APPLE_CALENDAR_CHANGED}' = 'true' ]; then
            docker compose logs --tail=30 apple-calendar || true
          fi

          # Logout so credentials don't persist on disk
          docker logout ghcr.io || true
          EOF

  ghcr_cleanup:
    runs-on: ubuntu-latest
    needs: [publish]
    if: >-
      always()
      && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.publish.result == 'success'
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prune grok-mcp-apple-calendar (keep 10 sha-*)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: grok-mcp-apple-calendar
          delete-tags: sha-*
          keep-n-tagged: "10"
          exclude-tags: main
          delete-untagged: true
          delete-orphaned-images: true
