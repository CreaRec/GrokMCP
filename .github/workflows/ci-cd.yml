name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  APPLE_CALENDAR_IMAGE: ghcr.io/crearec/grok-mcp-apple-calendar
  SYNOLOGY_IMAGE: ghcr.io/crearec/grok-mcp-synology
  DEPLOY_DIR: /home/crearec/grok-mcp

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple-calendar: ${{ steps.filter.outputs.apple-calendar }}
      synology: ${{ steps.filter.outputs.synology }}
      compose: ${{ steps.filter.outputs.compose }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apple-calendar:
              - 'servers/apple-calendar/**'
            synology:
              - 'servers/synology/**'
            compose:
              - 'docker-compose.yml'
            ci:
              - '.github/workflows/ci-cd.yml'

  test-apple-calendar:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/apple-calendar/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@crearec"

      - name: Install dependencies
        working-directory: servers/apple-calendar
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        working-directory: servers/apple-calendar
        run: npm test

      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.apple-calendar == 'true'

      - name: Build apple-calendar image (no push)
        if: needs.changes.outputs.apple-calendar == 'true'
        uses: docker/build-push-action@v7
        with:
          context: servers/apple-calendar
          push: false
          tags: ${{ env.APPLE_CALENDAR_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  test-synology:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/synology/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@crearec"

      - name: Install dependencies
        working-directory: servers/synology
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma client
        working-directory: servers/synology
        run: npx prisma generate

      - name: Run tests
        working-directory: servers/synology
        run: npm test

      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.synology == 'true'

      - name: Build synology image (no push)
        if: needs.changes.outputs.synology == 'true'
        uses: docker/build-push-action@v7
        with:
          context: servers/synology
          push: false
          tags: ${{ env.SYNOLOGY_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  publish-apple-calendar:
    runs-on: ubuntu-latest
    needs: [test-apple-calendar, changes]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.apple-calendar == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.APPLE_CALENDAR_IMAGE }}:main,${{ env.APPLE_CALENDAR_IMAGE }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: servers/apple-calendar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  publish-synology:
    runs-on: ubuntu-latest
    needs: [test-synology, changes]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.synology == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.SYNOLOGY_IMAGE }}:main,${{ env.SYNOLOGY_IMAGE }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: servers/synology
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [test-apple-calendar, test-synology, changes, publish-apple-calendar, publish-synology]
    if: >-
      always()
      && !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.test-apple-calendar.result == 'success'
      && needs.test-synology.result == 'success'
      && (needs.publish-apple-calendar.result == 'success' || needs.publish-apple-calendar.result == 'skipped')
      && (needs.publish-synology.result == 'success' || needs.publish-synology.result == 'skipped')
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'push'
          && (
            needs.changes.outputs.apple-calendar == 'true'
            || needs.changes.outputs.synology == 'true'
            || needs.changes.outputs.compose == 'true'
            || needs.changes.outputs.ci == 'true'
          )
        )
      )
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy compose pull/up
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          APPLE_CALENDAR_IMAGE_TAG_NEW: ${{ needs.publish-apple-calendar.outputs.image_tag }}
          SYNOLOGY_IMAGE_TAG_NEW: ${{ needs.publish-synology.outputs.image_tag }}
          APPLE_CALENDAR_CHANGED: ${{ needs.changes.outputs.apple-calendar }}
          SYNOLOGY_CHANGED: ${{ needs.changes.outputs.synology }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SERVER_HOST}"
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          SCP=(scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)

          "${SSH[@]}" "$SSH_TARGET" "mkdir -p '${DEPLOY_DIR}'"
          "${SCP[@]}" docker-compose.yml "${SSH_TARGET}:${DEPLOY_DIR}/docker-compose.yml"

          # Log remote Docker into GHCR (stdin, never echo token)
          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" "$SSH_TARGET" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          "${SSH[@]}" "$SSH_TARGET" bash -s <<EOF
          set -euo pipefail
          cd '${DEPLOY_DIR}'

          if [ ! -f .env ]; then
            echo "ERROR: ${DEPLOY_DIR}/.env is missing. Create it from .env.example (app secrets + IMAGE)." >&2
            exit 1
          fi

          # Export tag only for images published in this run; leave others from .env.
          if [ '${APPLE_CALENDAR_CHANGED}' = 'true' ] && [ -n '${APPLE_CALENDAR_IMAGE_TAG_NEW}' ]; then
            export IMAGE_TAG='${APPLE_CALENDAR_IMAGE_TAG_NEW}'
          fi
          if [ '${SYNOLOGY_CHANGED}' = 'true' ] && [ -n '${SYNOLOGY_IMAGE_TAG_NEW}' ]; then
            export SYNOLOGY_IMAGE_TAG='${SYNOLOGY_IMAGE_TAG_NEW}'
          fi

          docker compose pull
          docker compose up -d
          docker compose ps
          if [ '${APPLE_CALENDAR_CHANGED}' = 'true' ]; then
            docker compose logs --tail=30 apple-calendar || true
          fi
          if [ '${SYNOLOGY_CHANGED}' = 'true' ]; then
            docker compose logs --tail=30 synology-mcp || true
          fi

          # Logout so credentials don't persist on disk
          docker logout ghcr.io || true
          EOF

  ghcr_cleanup:
    runs-on: ubuntu-latest
    needs: [publish-apple-calendar, publish-synology]
    if: >-
      always()
      && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && (needs.publish-apple-calendar.result == 'success' || needs.publish-synology.result == 'success')
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prune grok-mcp-apple-calendar (keep 10 sha-*)
        if: needs.publish-apple-calendar.result == 'success'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: grok-mcp-apple-calendar
          delete-tags: sha-*
          keep-n-tagged: "10"
          exclude-tags: main
          delete-untagged: true
          delete-orphaned-images: true

      - name: Prune grok-mcp-synology (keep 10 sha-*)
        if: needs.publish-synology.result == 'success'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: grok-mcp-synology
          delete-tags: sha-*
          keep-n-tagged: "10"
          exclude-tags: main
          delete-untagged: true
          delete-orphaned-images: true
