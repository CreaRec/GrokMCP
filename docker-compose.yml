services:
  apple-calendar:
    image: ${IMAGE:-ghcr.io/crearec/grok-mcp-apple-calendar}:${IMAGE_TAG:-main}
    container_name: grok-mcp-apple-calendar
    restart: unless-stopped
    ports:
      - "8792:8792"
    env_file:
      - .env
    environment:
      - PORT=8792
      - HOST=0.0.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-apple-calendar}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-mcp}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8792/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - lgtm

  grafana-mcp:
    image: grafana/mcp-grafana:1.1.0
    container_name: grok-mcp-grafana
    restart: unless-stopped
    ports:
      - "8793:8000"
    env_file:
      - .env
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000", "--allowed-hosts", "*"]
    networks:
      - default
      - lgtm

  search-db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: grok-mcp-search-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-synology}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-synology_index}
    volumes:
      - search-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synology} -d ${POSTGRES_DB:-synology_index}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

volumes:
  search-db-data:

networks:
  lgtm:
    external: true
