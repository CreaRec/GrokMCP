services:
  apple-calendar:
    image: ${IMAGE:-ghcr.io/crearec/grok-mcp-apple-calendar}:main
    container_name: grok-mcp-apple-calendar
    restart: unless-stopped
    ports:
      - "8792:8792"
    env_file:
      - .env
    environment:
      - PORT=8792
      - HOST=0.0.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-apple-calendar}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-mcp}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8792/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - lgtm

  grafana-mcp:
    image: grafana/mcp-grafana:1.1.0
    container_name: grok-mcp-grafana
    restart: unless-stopped
    ports:
      - "8793:8000"
    env_file:
      - .env
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000", "--allowed-hosts", "*"]
    networks:
      - default
      - lgtm

  synology-db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: grok-mcp-synology-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${SYNOLOGY_DB_USER:-synology}
      - POSTGRES_PASSWORD=${SYNOLOGY_DB_PASSWORD:-}
      - POSTGRES_DB=${SYNOLOGY_DB_NAME:-synology}
    volumes:
      - synology-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNOLOGY_DB_USER:-synology} -d ${SYNOLOGY_DB_NAME:-synology}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  synology-mcp:
    image: ${SYNOLOGY_IMAGE:-ghcr.io/crearec/grok-mcp-synology}:main
    container_name: grok-mcp-synology
    restart: unless-stopped
    ports:
      - "8794:8794"
    env_file:
      - .env
    environment:
      - PORT=8794
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${SYNOLOGY_DB_USER:-synology}:${SYNOLOGY_DB_PASSWORD}@synology-db:5432/${SYNOLOGY_DB_NAME:-synology}
      - TRANSFORMERS_CACHE=/app/.cache/transformers
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - OTEL_SERVICE_NAME=${SYNOLOGY_OTEL_SERVICE_NAME:-synology}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-mcp}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - OTEL_SERVICE_VERSION=${SYNOLOGY_OTEL_SERVICE_VERSION:-}
    volumes:
      - synology-mcp-cache:/app/.cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8794/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      synology-db:
        condition: service_healthy
    networks:
      - default
      - lgtm

  synology-indexer:
    image: ${SYNOLOGY_INDEXER_IMAGE:-ghcr.io/crearec/grok-mcp-synology-indexer}:main
    container_name: grok-mcp-synology-indexer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${SYNOLOGY_DB_USER:-synology}:${SYNOLOGY_DB_PASSWORD}@synology-db:5432/${SYNOLOGY_DB_NAME:-synology}
      - MOUNT_ROOT=/mnt/synology/Documents
      - INDEX_DAILY_AT=${INDEX_DAILY_AT:-21:00}
      - TZ=${TZ:-America/Chicago}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_TEMPLATE_ID=${RUNPOD_TEMPLATE_ID:-}
      - RUNPOD_IMAGE=${RUNPOD_IMAGE:-ollama/ollama}
      - RUNPOD_CLOUD_TYPE=${RUNPOD_CLOUD_TYPE:-SECURE}
      - RUNPOD_GPU_TYPE_ID=${RUNPOD_GPU_TYPE_ID:-NVIDIA GeForce RTX 4090}
      - RUNPOD_CONTAINER_DISK_GB=${RUNPOD_CONTAINER_DISK_GB:-80}
      - RUNPOD_DATA_CENTER_ID=${RUNPOD_DATA_CENTER_ID:-}
      - RUNPOD_OLLAMA_PORT=${RUNPOD_OLLAMA_PORT:-11434}
      - RUNPOD_OLLAMA_HEALTHY_TIMEOUT_MS=${RUNPOD_OLLAMA_HEALTHY_TIMEOUT_MS:-180000}
      - RUNPOD_LEAVE_RUNNING=${RUNPOD_LEAVE_RUNNING:-}
      - RUNPOD_START_RETRIES=${RUNPOD_START_RETRIES:-}
      - RUNPOD_START_RETRY_MS=${RUNPOD_START_RETRY_MS:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5vl:7b}
      - EMBED_MODEL=${EMBED_MODEL:-mxbai-embed-large}
      - DOCLING_SERVE_URL=${DOCLING_SERVE_URL:-http://docling-serve:5001}
      - DOCLING_CONTAINER_NAME=${DOCLING_CONTAINER_NAME:-grok-mcp-docling-serve}
      - DOCLING_HEALTHY_TIMEOUT_MS=${DOCLING_HEALTHY_TIMEOUT_MS:-300000}
      - DOCLING_LEAVE_RUNNING=${DOCLING_LEAVE_RUNNING:-}
      - DOCKER_SOCKET_PATH=${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      - DSM_HOST=${DSM_HOST:-}
      - DSM_SHARE_USER=${DSM_SHARE_USER:-}
      - DSM_SHARE_PASSWORD=${DSM_SHARE_PASSWORD:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - OTEL_SERVICE_NAME=${SYNOLOGY_INDEXER_OTEL_SERVICE_NAME:-synology-indexer}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-mcp}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - OTEL_SERVICE_VERSION=${SYNOLOGY_INDEXER_OTEL_SERVICE_VERSION:-}
    group_add:
      # Host docker group GID — required to rw the bind-mounted socket (mode 660).
      # Set DOCKER_GID in .env (stat -c %g /var/run/docker.sock or getent group docker).
      - "${DOCKER_GID:-995}"
    volumes:
      - ${SYNOLOGY_MOUNT_PATH:-/mnt/synology/Documents}:/mnt/synology/Documents:ro
      # Ephemeral docling-serve lifecycle: indexer starts/stops the sidecar per index run.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      synology-db:
        condition: service_healthy
    networks:
      - default
      - lgtm

  utilities:
    image: ${UTILITIES_IMAGE:-ghcr.io/crearec/grok-mcp-utilities}:main
    container_name: grok-mcp-utilities
    restart: unless-stopped
    ports:
      - "8795:8795"
    env_file:
      - .env
    environment:
      - PORT=8795
      - HOST=0.0.0.0
      - DASHBOARD_API_URL=${DASHBOARD_API_URL:-http://192.168.1.135:3080}
      - USER_TIMEZONE=${USER_TIMEZONE:-America/Chicago}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - OTEL_SERVICE_NAME=${UTILITIES_OTEL_SERVICE_NAME:-utilities}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-mcp}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - OTEL_SERVICE_VERSION=${UTILITIES_OTEL_SERVICE_VERSION:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8795/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - lgtm

  # Docling is NOT started by `docker compose up -d` (profile + restart: "no").
  # The synology-indexer starts this container when a run has docling-routed dirty files,
  # then stops it in a finally block. First deploy: create without starting:
  #   docker compose --profile docling up --no-start docling-serve
  docling-serve:
    profiles: ["docling"]
    image: ${DOCLING_SERVE_IMAGE:-ghcr.io/docling-project/docling-serve-cpu}:${DOCLING_SERVE_IMAGE_TAG:-latest}
    container_name: grok-mcp-docling-serve
    restart: "no"
    environment:
      - DOCLING_SERVE_ENABLE_UI=0
    volumes:
      - ${SYNOLOGY_MOUNT_PATH:-/mnt/synology/Documents}:/mnt/synology/Documents:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5001/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - default

volumes:
  synology-db-data:
  synology-mcp-cache:

networks:
  lgtm:
    external: true
