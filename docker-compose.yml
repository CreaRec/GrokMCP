services:
  apple-calendar:
    image: ${IMAGE:-ghcr.io/crearec/grok-mcp-apple-calendar}:${IMAGE_TAG:-main}
    container_name: grok-mcp-apple-calendar
    restart: unless-stopped
    ports:
      - "8792:8792"
    env_file:
      - .env
    environment:
      - PORT=8792
      - HOST=0.0.0.0
      - ICLOUD_CALDAV_USERNAME
      - ICLOUD_CALDAV_PASSWORD
      - ICLOUD_CALDAV_CALENDAR_URL
      - ICLOUD_CALDAV_REMINDERS_URL
      - USER_TIMEZONE
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8792/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
