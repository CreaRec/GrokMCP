services:
  apple-calendar:
    image: ${IMAGE:-ghcr.io/crearec/grok-mcp-apple-calendar}:${IMAGE_TAG:-main}
    container_name: grok-mcp-apple-calendar
    restart: unless-stopped
    ports:
      - "8792:8792"
    env_file:
      - .env
    environment:
      - PORT=8792
      - HOST=0.0.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-apple-calendar}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-mcp}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8792/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - lgtm

  grafana-mcp:
    image: grafana/mcp-grafana:1.1.0
    container_name: grok-mcp-grafana
    restart: unless-stopped
    ports:
      - "8793:8000"
    env_file:
      - .env
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000", "--allowed-hosts", "*"]
    networks:
      - default
      - lgtm

  synology-db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: grok-mcp-synology-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${SYNOLOGY_DB_USER:-synology}
      - POSTGRES_PASSWORD=${SYNOLOGY_DB_PASSWORD:-}
      - POSTGRES_DB=${SYNOLOGY_DB_NAME:-synology}
    volumes:
      - synology-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNOLOGY_DB_USER:-synology} -d ${SYNOLOGY_DB_NAME:-synology}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  synology-mcp:
    image: ${SYNOLOGY_IMAGE:-ghcr.io/crearec/grok-mcp-synology}:${SYNOLOGY_IMAGE_TAG:-main}
    container_name: grok-mcp-synology
    restart: unless-stopped
    ports:
      - "8794:8794"
    env_file:
      - .env
    environment:
      - PORT=8794
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${SYNOLOGY_DB_USER:-synology}:${SYNOLOGY_DB_PASSWORD}@synology-db:5432/${SYNOLOGY_DB_NAME:-synology}
      - TRANSFORMERS_CACHE=/app/.cache/transformers
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - OTEL_SERVICE_NAME=${SYNOLOGY_OTEL_SERVICE_NAME:-synology}
      - OTEL_SERVICE_NAMESPACE=${OTEL_SERVICE_NAMESPACE:-mcp}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - OTEL_SERVICE_VERSION=${SYNOLOGY_OTEL_SERVICE_VERSION:-}
    volumes:
      - synology-mcp-cache:/app/.cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8794/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      synology-db:
        condition: service_healthy
    networks:
      - default
      - lgtm

  synology-indexer:
    image: ${SYNOLOGY_INDEXER_IMAGE:-ghcr.io/crearec/grok-mcp-synology-indexer}:${SYNOLOGY_INDEXER_IMAGE_TAG:-main}
    container_name: grok-mcp-synology-indexer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${SYNOLOGY_DB_USER:-synology}:${SYNOLOGY_DB_PASSWORD}@synology-db:5432/${SYNOLOGY_DB_NAME:-synology}
      - MOUNT_ROOT=/mnt/synology/Documents
      - INDEX_DAILY_AT=${INDEX_DAILY_AT:-21:00}
      - TZ=${TZ:-America/Chicago}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5vl:7b}
      - EMBED_MODEL=${EMBED_MODEL:-mxbai-embed-large}
      - DSM_HOST=${DSM_HOST:-}
      - DSM_SHARE_USER=${DSM_SHARE_USER:-}
      - DSM_SHARE_PASSWORD=${DSM_SHARE_PASSWORD:-}
    volumes:
      - ${SYNOLOGY_MOUNT_PATH:-/mnt/synology/Documents}:/mnt/synology/Documents:ro
    depends_on:
      synology-db:
        condition: service_healthy
    networks:
      - default

volumes:
  synology-db-data:
  synology-mcp-cache:

networks:
  lgtm:
    external: true
